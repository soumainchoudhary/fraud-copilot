name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: "test-key-not-real"
        run: |
          pytest tests/ -v --tb=short -x

      - name: Check module imports
        run: |
          python -c "from app.config import get_settings; print('Config OK')"
          python -c "from app.models.schemas import ScoreRequest, BatchScoreRequest, AskRequest, CaseItem, RiskFactor; print('Schemas OK')"
          python -c "from app.routers import health, score, ask, cases, metrics; print('Routers OK')"
          python -c "from app.metrics import metrics; print('Metrics OK')"
          python -c "from app.security import auth, headers, rate_limiter, sanitizer; print('Security OK')"

